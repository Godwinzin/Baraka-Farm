<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <link rel="icon" type="image/png" href="Images/logo.png">
    <title>Admin - The Baraka Farm</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="main-container">
        <h2>Bookings Admin</h2>

        <div class="form-container">
            <form id="loginForm">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" autocomplete="current-password" required>
                </div>
                <button type="submit" class="btn">Log in</button>
            </form>
            <button id="logoutBtn" class="btn btn-secondary" hidden>Log out</button>
            <p id="adminMessage"></p>
        </div>

        <div style="overflow-x: auto;">
            <table id="bookingsTable">
                <thead>
                    <tr>
                        <th>ID</th><th>Name</th><th>Phone</th><th>Email</th>
                        <th>Received</th><th>Status</th><th></th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
        <div class="form-container" id="passwordSection" hidden>
            <h3>Change password</h3>
            <form id="passwordForm">
                <div class="form-group">
                    <label for="currentPassword">Current password</label>
                    <input type="password" id="currentPassword" autocomplete="current-password" required>
                </div>
                <div class="form-group">
                    <label for="newPassword">New password (10+ characters)</label>
                    <input type="password" id="newPassword" autocomplete="new-password" minlength="10" required>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm new password</label>
                    <input type="password" id="confirmPassword" autocomplete="new-password" minlength="10" required>
                </div>
                <button type="submit" class="btn">Change password</button>
            </form>
            <p id="passwordMessage"></p>
        </div>
    </main>
    <script src="admin.js"></script>
</body>
</html>
